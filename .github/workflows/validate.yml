name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 装上 jsonschema 才会跑 schema 那一层。没有它，validate.py 只做结构性
      # 检查——六份 .schema.json 就等于没人执行过。这是 CI 存在的首要理由。
      - name: 安装 schema 校验依赖
        run: pip install jsonschema referencing

      - name: 跑全部用例（含 schema 层）
        working-directory: bundle/v1
        run: python3 validate.py --tests

      # 例子与反例都是脚本生成的。重新生成一遍应当与提交的内容逐字节一致：
      # 不一致说明生成器改了却没重新生成，提交的夹具已经过期。
      - name: 确认提交的例子与用例没有过期
        working-directory: bundle/v1
        run: |
          python3 examples/make-minimal-bundle.py
          python3 tests/make-tests.py

      - name: 检查是否有未提交的差异
        run: |
          if ! git diff --quiet; then
            echo '::error::生成的例子/用例与提交的内容不一致，请重新生成后提交'
            git diff --stat
            exit 1
          fi

      # coveralls.mjs 是 JS —— runner 自带 node，不需要 setup-node。
      # 这个仓库没有 npm，所以脚本和它的测试都放在 tools/ 下。
      - name: 上报脚本自己的测试
        run: node --test tools/coveralls.test.mjs

      # 覆盖率上传：curl 打 Coveralls 的 /jobs 端点，用 repo token 认证。
      # **不引 coverallsapp/github-action**——它只认 github-token，还要把
      # @coveralls 以 Role: Write 请进仓库。
      #
      # 只在 push 上跑：fork 的 PR 拿不到 secrets，脚本会硬失败（故意不静默跳过）。
      #
      # --source 而不是 --include：**coverage.py 会把 --source 里从没被执行过的
      # 文件按 0% 报出来**，而 --include 会让它们干脆不出现。这一条正是这个仓库
      # 需要的——`canonical/v1/validate.py` 今天没有任何 CI 步骤会执行它（它只
      # 接受一个 canonical 目录，而真实 canonical 是私人数据），所以它就该显示成
      # 0%，而不是从分母里消失。总数因此是 52% 而不是 77%，低的那个才是真的。
      #
      # 生成器（tests/、examples/ 下的 make-*.py）用 --omit 排掉：它们是造夹具的
      # 脚本，CI 跑它们只为比对字节是否一致，算进覆盖率只会把总数抬高而不说明什么。
      - name: 覆盖率 → Coveralls
        if: github.event_name == 'push'
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: |
          pip install coverage
          python3 -m coverage run --source=bundle/v1,canonical/v1 \
            --omit='*/tests/*,*/examples/*' \
            bundle/v1/validate.py --tests
          python3 -m coverage lcov -o lcov.info
          node tools/coveralls.mjs lcov.info
